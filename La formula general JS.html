<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Fórmula General - Diana Gallardo</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 40px; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #34495e; }
        input { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        button:hover { background-color: #219150; }
        #resultado { margin-top: 20px; padding: 15px; border-radius: 6px; display: none; text-align: center; line-height: 1.6; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>Fórmula General</h2>
    <p style="text-align: center; font-style: italic;">ax² + bx + c = 0</p>
    
    <div class="input-group">
        <label for="valA">Valor de a:</label>
        <input type="number" id="valA" step="any" placeholder="Ej: 1">
    </div>
    
    <div class="input-group">
        <label for="valB">Valor de b:</label>
        <input type="number" id="valB" step="any" placeholder="Ej: -5">
    </div>
    
    <div class="input-group">
        <label for="valC">Valor de c:</label>
        <input type="number" id="valC" step="any" placeholder="Ej: 6">
    </div>

    <button onclick="resolverEcuacionCuadratica()">Calcular x1 y x2</button>

    <div id="resultado"></div>
</div>

<script>
    function resolverEcuacionCuadratica() {
        // capturar de valores
        const a = parseFloat(document.getElementById('valA').value);
        const b = parseFloat(document.getElementById('valB').value);
        const c = parseFloat(document.getElementById('valC').value);
        const cajaResultado = document.getElementById('resultado');

        // limpiar estado previo
        cajaResultado.style.display = "block";
        cajaResultado.className = "";

        // validaciones 
        if (isNaN(a) || isNaN(b) || isNaN(c)) {
            mostrarError("Por favor, completa todos los campos.");
            return;
        }

        if (a === 0) {
            mostrarError("El valor de 'a' no puede ser 0 (no sería una ecuación cuadrática).");
            return;
        }

        // cálculo del discriminante (b² - 4ac)
        const discriminante = Math.pow(b, 2) - (4 * a * c);

        if (discriminante < 0) {
            mostrarError("El discriminante es negativo (" + discriminante + "). Las raíces son imaginarias.");
        } else {
            // aplicación de la fórmula
            const x1 = (-b + Math.sqrt(discriminante)) / (2 * a);
            const x2 = (-b - Math.sqrt(discriminante)) / (2 * a);

            cajaResultado.classList.add('success');
            cajaResultado.innerHTML = `<strong>Resultados:</strong><br>
                                       x1 = ${x1.toFixed(4)}<br>
                                       x2 = ${x2.toFixed(4)}`;
        }
    }

    function mostrarError(mensaje) {
        const cajaResultado = document.getElementById('resultado');
        cajaResultado.classList.add('error');
        cajaResultado.innerText = mensaje;
    }
</script>

</body>
</html>
