<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaciones Aritméticas en JS - Diana Gallardo/title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; background-color: #f0f2f5; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 400px; }
        h2 { color: #1a73e8; border-bottom: 1px solid #ddd; padding-bottom: 10px; }
        p { font-size: 1.1em; color: #444; margin: 10px 0; }
        span { font-weight: bold; color: #d93025; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Resultados del Cálculo</h2>
        <p>Suma: <span id="suma"></span></p>
        <p>Resta: <span id="resta"></span></p>
        <p>División: <span id="division"></span></p>
        <p>Exponenciación: <span id="exponente"></span></p>
    </div>

    <script>
        // declaración de variables y asignación de valores
        const num1 = 10;
        const num2 = 3;

        // realización de operaciones
        const resultadoSuma = num1 + num2;
        const resultadoResta = num1 - num2;
        const resultadoDivision = num1 / num2;
        const resultadoExponente = num1 ** num2; // Operador de exponenciación 

        // impresión en la página web mediante el DOM
        document.getElementById("suma").innerHTML = resultadoSuma;
        document.getElementById("resta").innerHTML = resultadoResta;
        
        // toFixed(2) para que la división no tenga demasiados decimales
        document.getElementById("division").innerHTML = resultadoDivision.toFixed(2);
        document.getElementById("exponente").innerHTML = resultadoExponente;
        console.log("Cálculos completados con éxito.");
    </script>

</body>
</html>
