<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC - Diana Gallardo</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fff0f5; display: flex; justify-content: center; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 450px; border-top: 5px solid #ff69b4; }
        h2 { text-align: center; color: #d81b60; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #777; font-size: 0.9em; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #444; }
        input { width: 100%; padding: 12px; border: 2px solid #ffd1dc; border-radius: 8px; box-sizing: border-box; font-size: 1rem; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: #ff69b4; }
        button { width: 100%; padding: 15px; background-color: #ff69b4; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #e05297; }
        
        #resultado-area { 
            margin-top: 25px; 
            padding: 20px; 
            border-radius: 10px; 
            display: none; 
            text-align: center; 
            animation: fadeIn 0.5s;
        }
        .imc-valor { font-size: 2em; font-weight: bold; margin: 10px 0; }
        .grado-texto { font-size: 1.2em; text-transform: uppercase; letter-spacing: 1px; }
        .bajo { background-color: #e3f2fd; color: #1976d2; }
        .normal { background-color: #e8f5e9; color: #2e7d32; }
        .sobrepeso { background-color: #fff3e0; color: #ef6c00; }
        .obesidad { background-color: #ffebee; color: #c62828; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="card">
    <h2>Calculadora de IMC</h2>
    <p class="subtitle">Referencia: Parámetros OMS (Mujeres Adultas)</p>
    
    <div class="input-group">
        <label for="peso">Peso actual (kg):</label>
        <input type="number" id="peso" step="0.1" placeholder="Ej: 65.5">
    </div>
    
    <div class="input-group">
        <label for="estatura">Estatura (metros):</label>
        <input type="number" id="estatura" step="0.01" placeholder="Ej: 1.65">
    </div>

    <button onclick="calcularIMC()">Calcular mi Índice</button>

    <div id="resultado-area">
        <div>Tu Índice de Masa Corporal es:</div>
        <div id="imc-num" class="imc-valor">0.0</div>
        <div id="imc-rango" class="grado-texto">---</div>
    </div>
</div>

<script>
    function calcularIMC() {
        const peso = parseFloat(document.getElementById('peso').value);
        const estatura = parseFloat(document.getElementById('estatura').value);
        const area = document.getElementById('resultado-area');
        const displayIMC = document.getElementById('imc-num');
        const displayRango = document.getElementById('imc-rango');

        // validación
        if (!peso || !estatura || estatura <= 0) {
            alert("Por favor, ingresa valores válidos para peso y estatura.");
            return;
        }

        const imc = peso / (estatura * estatura);
        displayIMC.innerText = imc.toFixed(1);
        
        // determinar grado 
        let categoria = "";
        let claseCSS = "";

        if (imc < 18.5) {
            categoria = "Bajo peso";
            claseCSS = "bajo";
        } else if (imc >= 18.5 && imc <= 24.9) {
            categoria = "Peso Normal (Saludable)";
            claseCSS = "normal";
        } else if (imc >= 25 && imc <= 29.9) {
            categoria = "Sobrepeso";
            claseCSS = "sobrepeso";
        } else if (imc >= 30 && imc <= 34.9) {
            categoria = "Obesidad Grado I (Leve)";
            claseCSS = "obesidad";
        } else if (imc >= 35 && imc <= 39.9) {
            categoria = "Obesidad Grado II (Media)";
            claseCSS = "obesidad";
        } else {
            categoria = "Obesidad Grado III (Mórbida)";
            claseCSS = "obesidad";
        }

        area.style.display = "block";
        area.className = claseCSS; 
        displayRango.innerText = categoria;
    }
</script>

</body>
</html>
