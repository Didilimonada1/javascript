<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Dinámico de Tablas - Gallardo Gonzalez Diana Laura</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }
        .configuracion {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }
        input {
            padding: 10px;
            width: 80px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            margin-right: 10px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background-color: #0056b3; }

        #contenedor-tablas {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }
        .tabla-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border-top: 4px solid #007bff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            text-align: center;
        }
        h3 { margin-top: 0; color: #333; font-size: 1.1rem; }
        .linea { font-family: monospace; color: #555; margin: 4px 0; }
    </style>
</head>
<body>

    <div class="configuracion">
        <h2>Tablas de Multiplicar</h2>
        <label for="limite">Generar hasta la tabla del:</label>
        <input type="number" id="limite" min="1" placeholder="Ej: 5">
        <button onclick="generarTablasDinamicas()">Generar</button>
    </div>

    <div id="contenedor-tablas"></div>

    <script>
        function generarTablasDinamicas() {
            const input = document.getElementById('limite');
            const contenedor = document.getElementById('contenedor-tablas');
            const n = parseInt(input.value);

            if (isNaN(n) || n <= 0) {
                alert("Por favor, introduce un número entero positivo.");
                return;
            }

            contenedor.innerHTML = "";

            // genera las tablas desde el 1 hasta el número 'n'
            for (let i = 1; i <= n; i++) {
                const card = document.createElement('div');
                card.className = 'tabla-card';
                
                let contenido = `<h3>Tabla del ${i}</h3>`;
                
                // multiplica el número actual del 1 al 10
                for (let j = 1; j <= 10; j++) {
                    contenido += `<div class="linea">${i} x ${j} = ${i * j}</div>`;
                }
                
                card.innerHTML = contenido;
                contenedor.appendChild(card);
            }
        }
    </script>

</body>
</html>
